name: Release

# A release is one tag push on a commit whose Cargo.toml (and Cargo.lock) has
# that version:
#
#   git tag -a v1.2.3 -m "v1.2.3" && git push origin v1.2.3
#
# The shared pipeline (zentinelproxy/.github, agent-release.yml) refuses a tag
# that does not match Cargo.toml, builds every platform from the tag with
# --locked, runs scripts/smoke-test.sh behind the latest Zentinel release on
# each, and publishes zentinel-auth-agent-<version>-<platform>.tar.gz (+ .sha256),
# the names `zentinel bundle install` downloads, only if all of them pass. It
# never replaces an existing release. Running it by hand is a dry run.
#
# Pinned to the pilot branch for now: switch both refs to v1 once
# zentinelproxy/.github is tagged.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    uses: zentinelproxy/.github/.github/workflows/agent-release.yml@v1
    with:
      binary: zentinel-auth-agent
      # The CI jobs install the same packages.
      apt-packages: protobuf-compiler pkg-config libxml2-dev libxmlsec1-dev
      # samael (SAML) links libxmlsec1 on macOS too.
      brew-packages: protobuf pkg-config libxmlsec1
      setup-macos: |
        echo "LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"
        echo "PKG_CONFIG_PATH=$(brew --prefix)/lib/pkgconfig:$(brew --prefix libxmlsec1)/lib/pkgconfig" >> "$GITHUB_ENV"
      smoke-command: scripts/smoke-test.sh
      harness-ref: v1
